// tech-blue tutorial engine · landscape 1920x1080, dark tech/HUD look. Texts come from ep.js (window.EP).
// One host track (three takes joined). Real screen recordings of Grok Bot play inside a device frame on the right,
// pushed in on whatever is being talked about, with numbered call-outs. Each step opens with a STEP card.
const TT=window.TIM.p;const OFF=-window.TRIM;const LIPN=window.LIPN;
const W=1920,H=1080;const c=document.getElementById('c');c.width=W;c.height=H;const G0=c.getContext('2d');let g=G0;
const oc=document.createElement('canvas');oc.width=W;oc.height=H;const OG=oc.getContext('2d');
window.FILM_DURATION=OFF+TT.dur+0.6;
const BG='#05060B',FG='#EEF3FF',MUT='#8C96B8',CY='#27E1FF',VI='#8B6CFF',VI2='#B9A6FF',GOLD='#FFC24B',CORAL='#FF6B4A',GREEN='#33E59A',PANEL='rgba(14,20,38,0.92)',LINE='#22305A',RED='#FF4D6D';
const F='"PingFang SC","Hiragino Sans GB",sans-serif',M='"SF Mono",Menlo,monospace';
const U=(t,p)=>t<=0?0:Spring.unit(t,p);const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const CAPS=TT.caps.map(x=>[x.t0,x.t1,x.text]);
const cs=k=>{const x=CAPS.find(c=>c[2].includes(k));if(!x)throw new Error('no caption '+k);return x[0];};
const cxn=(k,n)=>{const xs=CAPS.filter(c=>c[2].includes(k));if(xs.length<n)throw new Error('no caption '+k+' #'+n);return xs[n-1][0];};
function rand(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function txt(s,x,y,size,w,col,al='center',a=1,font=F,glow=0){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.fillStyle=col;g.font=`${w} ${size}px ${font}`;g.textAlign=al;g.textBaseline='middle';
  if(glow){g.shadowColor=col;g.shadowBlur=glow;}g.fillText(s,x,y);g.restore();}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function box(x,y,w,h,a,fill=PANEL,stroke=LINE,r=18,glow=0){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.shadowColor=glow?stroke:'rgba(0,0,0,0.6)';g.shadowBlur=glow||30;rr(x,y,w,h,r);g.fillStyle=fill;g.fill();g.shadowColor='transparent';g.lineWidth=2;g.strokeStyle=stroke;g.stroke();g.restore();}
// HUD corner brackets around a rectangle
function brackets(x,y,w,h,col,a,len=26,lw=3){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=lw;g.shadowColor=col;g.shadowBlur=12;g.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{g.moveTo(px,py+sy*len);g.lineTo(px,py);g.lineTo(px+sx*len,py);});g.stroke();g.restore();}
const P=(u,d=0,p='playful')=>U(u-d,p);const A=(u,d=0)=>cl(U(u-d,'snappy'));
function kin(s,x,y,size,col,u,d=0,stag=0.04,glow=24,al='center'){g.save();g.font=`900 ${size}px ${F}`;const chars=[...s];const ws=chars.map(ch=>g.measureText(ch).width);const tw=ws.reduce((a,b)=>a+b,0);g.restore();
  let cx0=al==='left'?x:x-tw/2;chars.forEach((ch,i)=>{const p=U(u-d-i*stag,'playful');if(p>0.001){g.save();g.translate(cx0+ws[i]/2,y-(1-cl(p))*90);g.scale(0.5+0.5*p,0.5+0.5*p);
    txt(ch,0,0,size,900,col,'center',cl(p*1.6),F,glow);g.restore();}cx0+=ws[i];});}
// decode-style text: random glyphs settle into the real string (tech feel)
const GLY='01ABCDEF#$%&*<>/\\|=+';
function decode(s,x,y,size,col,u,d=0,dur=0.5,al='left',font=M,w=800){const chars=[...s];const k=cl((u-d)/dur);const n=Math.floor(chars.length*k);let out='';
  for(let i=0;i<chars.length;i++)out+=i<n?chars[i]:(i<n+4&&k>0?GLY[Math.floor(rand(i+Math.floor(u*24))*GLY.length)]:'');txt(out,x,y,size,w,col,al,cl(k*3),font,10);}
function chip(s,x,y,size,fill,col,a,rot=0){if(a<=0.002)return;g.save();g.font=`800 ${size}px ${F}`;const w=g.measureText(s).width+size*1.1;g.translate(x,y);g.rotate(rot);g.globalAlpha*=a;g.shadowColor=fill;g.shadowBlur=22;rr(-w/2,-size*0.8,w,size*1.6,size*0.5);g.fillStyle=fill;g.fill();g.restore();
  g.save();g.translate(x,y);g.rotate(rot);txt(s,0,0,size,800,col,'center',a);g.restore();}
function check(x,y,r,col,a){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.shadowColor=col;g.shadowBlur=20;g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill();g.shadowBlur=0;g.strokeStyle=BG;g.lineWidth=r*0.22;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x-r*0.45,y);g.lineTo(x-r*0.1,y+r*0.35);g.lineTo(x+r*0.5,y-r*0.35);g.stroke();g.restore();}
function cross(x,y,r,col,a,lw=12){if(a<=0.002)return;const p=cl(a);g.save();g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.shadowColor=col;g.shadowBlur=18;g.beginPath();g.moveTo(x-r,y-r);g.lineTo(x-r+2*r*cl(p*2),y-r+2*r*cl(p*2));if(p>0.5){g.moveTo(x+r,y-r);g.lineTo(x+r-2*r*cl(p*2-1),y-r+2*r*cl(p*2-1));}g.stroke();g.restore();}
const cache={};function frame(src){if(cache[src])return cache[src];return cache[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
const IM={};const pad=n=>String(n).padStart(4,'0');
// numbered call-out label: "01  text" pill with a leader line to a point
function callout(n,s,x,y,a,col=CY,tx=null,ty=null){if(a<=0.002)return;g.save();g.font=`800 34px ${F}`;const w=g.measureText(s).width+120;g.restore();
  if(tx!==null){g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();g.moveTo(x+w,y);g.lineTo(tx,ty);g.stroke();g.setLineDash([]);g.fillStyle=col;g.beginPath();g.arc(tx,ty,7,0,7);g.fill();g.restore();}
  box(x,y-34,w,68,a,'rgba(8,12,26,0.94)',col,12,18);g.save();g.globalAlpha=a;g.fillStyle=col;rr(x,y-34,64,68,[12,0,0,12]);g.fill();g.restore();
  txt(String(n).padStart(2,'0'),x+32,y,32,900,BG,'center',a,M);txt(s,x+82,y,34,800,FG,'left',a);}
// ===== screen recordings: window.CLIPS[name]={n,fps,w,h}; frames assets/clips/<name>/0001.jpg …
// draws the clip at clip-time tc inside a device frame; z = [fx,fy,zoom] focus point (0..1 of the source) and zoom
async function scr(name,tc,x,y,hgt,a,z=[0.5,0.5,1],label=''){if(a<=0.002)return;const C=window.CLIPS[name];const idx=cl(Math.floor(tc*C.fps)+1,1,C.n);
  const im=await frame(`assets/clips/${name}/${pad(idx)}.jpg`);const wdt=hgt*C.w/C.h;
  g.save();g.globalAlpha=a;g.shadowColor='rgba(39,225,255,0.35)';g.shadowBlur=50;rr(x-10,y-10,wdt+20,hgt+20,20);g.fillStyle='#0A0F1F';g.fill();g.shadowBlur=0;g.lineWidth=2;g.strokeStyle='rgba(39,225,255,0.55)';g.stroke();
  rr(x,y,wdt,hgt,12);g.clip();if(im){const zz=Math.max(1,z[2]);const sw=C.w/zz,sh=C.h/zz;const sx=cl(z[0]*C.w-sw/2,0,C.w-sw),sy=cl(z[1]*C.h-sh/2,0,C.h-sh);g.drawImage(im,sx,sy,sw,sh,x,y,wdt,hgt);}
  // scanline sweep
  const sl=((tc*0.35)%1)*hgt;const gr=g.createLinearGradient(0,y+sl-40,0,y+sl+40);gr.addColorStop(0,'rgba(39,225,255,0)');gr.addColorStop(0.5,'rgba(39,225,255,0.07)');gr.addColorStop(1,'rgba(39,225,255,0)');g.fillStyle=gr;g.fillRect(x,y+sl-40,wdt,80);
  g.restore();brackets(x-22,y-22,wdt+44,hgt+44,CY,a);
  if(label){txt('● REC',x+4,y+hgt+40,22,800,RED,'left',a*(0.6+0.4*Math.sin(tc*6)),M);txt(label,x+wdt,y+hgt+40,22,700,MUT,'right',a,M);}
  return wdt;}
// map a point given as fraction of the source to screen coords for a clip drawn by scr with the same args
function scrPt(name,x,y,hgt,z,fx,fy){const C=window.CLIPS[name];const wdt=hgt*C.w/C.h;const zz=Math.max(1,z[2]);const sw=C.w/zz,sh=C.h/zz;const sx=cl(z[0]*C.w-sw/2,0,C.w-sw),sy=cl(z[1]*C.h-sh/2,0,C.h-sh);
  return [x+(fx*C.w-sx)/sw*wdt,y+(fy*C.h-sy)/sh*hgt];}
// animated zoom between keyframes: keys [[t,[fx,fy,z]],…] with a camera spring
function zk(u,keys){return [0,1,2].map(j=>Spring.to(u,keys.map(([t,v])=>[t,v[j]]),'camera'));}
// ring highlight around a source-fraction rect
function hl(name,x,y,hgt,z,r,a,col=GOLD){if(a<=0.002)return;const [x0,y0]=scrPt(name,x,y,hgt,z,r[0],r[1]);const [x1,y1]=scrPt(name,x,y,hgt,z,r[2],r[3]);
  const C=window.CLIPS[name],wd=hgt*C.w/C.h;g.save();rr(x,y,wd,hgt,12);g.clip();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=4;g.shadowColor=col;g.shadowBlur=18;rr(x0-6,y0-6,x1-x0+12,y1-y0+12,10);g.stroke();g.restore();return [x0,y0,x1,y1];}
// STEP title card (left half)
function stepCard(n,title,sub,u,a){const p=cl(P(u,0.02));g.save();g.globalAlpha=a;g.translate((1-cl(U(u,'camera')))*-300,0);
  txt('STEP',140,300,40,900,CY,'left',a,M,16);decode(String(n).padStart(2,'0'),250,300,40,CY,u,0.05,0.3);
  g.fillStyle=CY;g.globalAlpha=a*0.9;g.fillRect(140,335,320*cl(U(u-0.1,'camera')),4);g.globalAlpha=a;
  g.restore();kin(title,140,420,104,FG,u,0.12,0.05,30,'left');if(sub)txt(sub,142,520,38,700,MUT,'left',a*A(u,0.5));}
// ===== shared scene helpers
const SX=1190,SY=130,SH=830;            // screen panel
const ramp=(u,u0,u1,t0,t1)=>t0+(t1-t0)*cl((u-u0)/Math.max(0.001,u1-u0));
const at=(h,k)=>h-cs(k);
function mascot(x,y,r,col,a,shape=0,blink=0){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.translate(x,y);g.shadowColor=col;g.shadowBlur=30;g.fillStyle=col;g.beginPath();
  if(shape===1){for(let i=0;i<=40;i++){const an=i/40*Math.PI*2,rr2=r*(1+0.12*Math.sin(an*5));g.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}}else if(shape===2){g.roundRect(-r,-r,2*r,2*r,r*0.45);}else g.arc(0,0,r,0,7);g.fill();g.shadowBlur=0;
  g.fillStyle='#0A0F1F';const eh=r*0.34*(1-0.9*blink);rr(-r*0.32,-eh/2-r*0.05,r*0.16,eh,r*0.08);g.fill();rr(r*0.14,-eh/2-r*0.05,r*0.16,eh,r*0.08);g.fill();g.restore();}

// ======== 第76期 · 横屏观点口播 · 照参考片（adu 模板 09 风格）重做：黑底 HUD + 橘红/蓝紫整屏闪 + 像素溶解 + 真人三态 + 中英字幕 ========
// 引擎只借：字幕时间(CAPS/cs)、渲染流程、txt/kin/decode/cross/check/rand/rr/frame/pad。整帧绘制在下面 render76 里接管。

const SCN=[[0,'corner','',async()=>{}]];   // 占位：引擎要求有 SCN；实际画面全在 render76
const OR='#FF4A1C',BL='#4D3BFF',INK='#0B0B10',WT='#F4F4F6',GR='#8A8A96',DIM='#2A2A33';

const E3=v=>{v=cl(v);return 1-Math.pow(1-v,3)};const EB=v=>{v=cl(v);const s=1.7;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const cnt=(a,b,t,d=0,dur=1)=>Math.round(a+(b-a)*E3((t-d)/dur));

// ---------- 基础部件
function T(s,x,y,size,col,al='left',a=1,w=900,font=F){txt(s,x,y,size,w,col,al,a,font);}
function tw7(s,size,w=900,font=F){g.save();g.font=`${w} ${size}px ${font}`;const r=g.measureText(s).width;g.restore();return r;}
// 砸字：从大到小落位 + 一圈冲击线
function slam(s,x,y,size,col,t,al='left',w=900){if(t<=0)return;const k=cl(t/0.2),sc=k<1?lerp(1.9,1,E3(k)):1+0.04*Math.exp(-8*(t-0.2))*Math.sin((t-0.2)*28);
  const ww=tw7(s,size,w);const cx=al==='left'?x+ww/2:al==='right'?x-ww/2:x;g.save();g.translate(cx,y);g.scale(sc,sc);T(s,0,0,size,col,'center',cl(t/0.06),w);g.restore();
  if(t<0.5){g.save();g.globalAlpha=(1-t/0.5)*0.7;g.strokeStyle=col;g.lineWidth=3;g.strokeRect(cx-ww/2-20-t*120,y-size*0.6-t*60,ww+40+t*240,size*1.2+t*120);g.restore();}}
// 黑色斜框标签（参考片的 NOPE. 卡）
function tagBox(s,x,y,size,t,rot=-0.06,bg=INK,col=WT){if(t<=0)return;const k=EB(t/0.35),w=tw7(s,size,900,F)+size*0.9,h=size*1.35;g.save();g.translate(x,y);g.rotate(rot);g.scale(k,k);g.globalAlpha*=cl(t/0.1);
  g.fillStyle=bg;g.fillRect(-w/2,-h/2,w,h);T(s,0,4,size,col,'center',1,900,F);g.restore();}
// 胶囊
function pill(s,x,y,size,fill,col,a,rot=0){if(a<=0.002)return;const w=tw7(s,size,800)+size*1.2;g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha*=a;rr(-w/2,-size*0.8,w,size*1.6,size*0.8);g.fillStyle=fill;g.fill();T(s,0,2,size,col,'center',1,800);g.restore();}
// 等宽小字标签
function mono(s,x,y,size,col,al='left',a=1){txt(s,x,y,size,700,col,al,a,M);}
// 通用小人头像（手画）
function person(x,y,r,a,col='#3A3A46'){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.beginPath();g.arc(x,y,r,0,7);g.fillStyle='#16161C';g.fill();g.strokeStyle='#44444F';g.lineWidth=2;g.stroke();
  g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();g.fillStyle=col;g.beginPath();g.arc(x,y-r*0.18,r*0.36,0,7);g.fill();g.beginPath();g.ellipse(x,y+r*0.75,r*0.7,r*0.5,0,0,7);g.fill();g.restore();g.restore();}
// App 图标
const ICONS=['queshen','shensu','vidprompt','ansui','mailme','mote','aihire'];const IMGI={};
ICONS.forEach(k=>frame(`assets/img/icon_${k}.png`).then(i=>IMGI[k]=i));
function appIcon(k,x,y,s,a){if(a<=0.002)return;g.save();g.globalAlpha*=a;rr(x-s/2,y-s/2,s,s,s*0.22);g.save();g.clip();if(k&&IMGI[k])g.drawImage(IMGI[k],x-s/2,y-s/2,s,s);else{g.fillStyle='#1C1C24';g.fillRect(x-s/2,y-s/2,s,s);}g.restore();
  if(!k){g.strokeStyle='#4A4A55';g.lineWidth=2;g.setLineDash([6,5]);rr(x-s/2,y-s/2,s,s,s*0.22);g.stroke();g.setLineDash([]);T('审核中',x,y,s*0.2,GR,'center',1,800);}g.restore();}
// 文档（手画）
function doc(x,y,w,h,a,stamp='',col=WT){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x+w-18,y);g.lineTo(x+w,y+18);g.lineTo(x+w,y+h);g.lineTo(x,y+h);g.closePath();g.fill();
  g.fillStyle='rgba(0,0,0,0.18)';for(let i=0;i<5;i++)g.fillRect(x+14,y+26+i*16,(w-28)*(i%2?0.7:0.9),6);if(stamp){g.save();g.translate(x+w/2,y+h*0.62);g.rotate(-0.25);g.strokeStyle=OR;g.lineWidth=4;g.strokeRect(-w*0.42,-16,w*0.84,32);T(stamp,0,2,22,OR,'center',1,900,M);g.restore();}g.restore();}
// 太阳 / 月亮 / 摄像机 / 手机（手画）
function sun(x,y,r,a,u){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.translate(x,y);g.rotate(u*0.4);g.fillStyle='#FFC24B';g.beginPath();g.arc(0,0,r,0,7);g.fill();g.strokeStyle='#FFC24B';g.lineWidth=5;g.lineCap='round';
  for(let i=0;i<8;i++){const an=i*Math.PI/4;g.beginPath();g.moveTo(Math.cos(an)*r*1.35,Math.sin(an)*r*1.35);g.lineTo(Math.cos(an)*r*1.75,Math.sin(an)*r*1.75);g.stroke();}g.restore();}
function moon(x,y,r,a){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.fillStyle='#C9CCFF';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x+r*0.45,y-r*0.3,r*0.85,0,7);g.fill();g.restore();}

  g.beginPath();g.moveTo(50,-25);g.lineTo(95,-48);g.lineTo(95,48);g.lineTo(50,25);g.closePath();g.fill();g.stroke();g.fillStyle=Math.sin(u*8)>0?OR:'#55202A';g.beginPath();g.arc(-55,-28,7,0,7);g.fill();T('REC',-30,-28,16,WT,'left',1,800,M);g.restore();}

// 消息气泡

// 真实素材（11-07 他给的）
const IMGX={};['agents','dash','pipe','create','store','apps'].forEach(k=>frame(`assets/img/${k}.jpg`).then(i=>IMGX[k]=i));
function phoneImg(k,cx,cy,w,hh,rot,a){if(a<=0.002)return;g.save();g.globalAlpha*=a;g.translate(cx,cy);g.rotate(rot);g.shadowColor='rgba(0,0,0,0.6)';g.shadowBlur=30;rr(-w/2-8,-hh/2-8,w+16,hh+16,w*0.16);g.fillStyle='#111';g.fill();g.shadowBlur=0;g.strokeStyle='#C8CCD6';g.lineWidth=3;g.stroke();
  g.save();rr(-w/2,-hh/2,w,hh,w*0.13);g.clip();const im=IMGX[k];if(im){const s=Math.max(w/im.width,hh/im.height);g.drawImage(im,-im.width*s/2,-hh/2,im.width*s,im.height*s);}g.restore();g.restore();}

let BEATS=[];
function beatPulse(t){let v=0;for(let i=BEATS.length-1;i>=0;i--){const b=BEATS[i];if(b>t)continue;const dt=t-b;if(dt>.6)break;v=Math.max(v,Math.exp(-dt*10));}return v;}
